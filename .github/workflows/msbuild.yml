name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  SOLUTION_FILE_PATH: FPLV.sln
  BUILD_CONFIGURATION: "Euroscope 3.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022  # Utilise une image avec VS2022 préinstallé

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild environment (avec MFC)
      uses: microsoft/setup-msbuild@v1.1
      with:
        vs-version: '[17.4,18.0)'
        msbuild-architecture: x86

    - name: Validate SDK dependencies exist
      run: |
        $required = @(
          ".\inc\3.2\EuroScopePlugIn.h",
          ".\inc\rapidjson\rapidjson.h",
          ".\lib\3.2\Euroscope.lib"
        )
        $missing = @()
        foreach ($p in $required) {
          if (-not (Test-Path $p)) { $missing += $p }
        }
        if ($missing.Count -gt 0) {
          Write-Host "Missing required files:"
          $missing | ForEach-Object { Write-Host " - $_" }
          Write-Host "Repository content must include inc/ and lib/ folders."
          exit 1
        }

    - name: Build solution
      run: |
        msbuild /m /p:Configuration="${{ env.BUILD_CONFIGURATION }}" /p:Platform=Win32 "${{ env.SOLUTION_FILE_PATH }}"
